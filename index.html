<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Abdulaziz “Marlon” Andaya</title>

<!-- Font Awesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    body {
        margin: 0;
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #0F1F3A;
        color: #C0C0C0;
    }

    .contact-section {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        padding: 100px 60px;
        background-color: #0F1F3A;
    }

    /* LEFT SIDE */
    .contact-left {
        flex: 1;
        min-width: 300px;
        max-width: 45%;
    }

    .contact-left h2 {
        font-size: 72px;
        font-weight: 700;
        color: #FFFFFF;
        line-height: 1.1;
        margin-bottom: 20px;
    }

    .contact-left p {
        font-size: 16px;
        color: #C0C0C0;
        margin-bottom: 40px;
    }

    .contact-info {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .contact-item {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 18px;
        color: #BFC3C7;
    }

    .contact-item i {
        font-size: 22px;
        color: #BFC3C7;
    }

    .contact-item a {
        color: #BFC3C7;
        text-decoration: none;
    }

    .contact-item a:hover {
        opacity: 0.7;
    }

    /* RIGHT SIDE */
    .contact-right {
        flex: 1;
        min-width: 300px;
        max-width: 45%;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    label {
        font-size: 12px;
        letter-spacing: 1px;
        color: #C0C0C0;
        text-transform: uppercase;
    }

    input, textarea {
        padding: 12px;
        border: none;
        border-bottom: 1px solid #BFC3C7;
        background-color: #0F1F3A;
        color: #FFFFFF;
        font-size: 16px;
        outline: none;
    }

    input::placeholder, textarea::placeholder {
        color: #7A8CA8;
    }

    textarea {
        resize: none;
    }

    .note {
        font-size: 13px;
        color: #7A8CA8;
    }

    button {
        align-self: flex-end;
        background-color: #BFC3C7;
        color: #0F1F3A;
        padding: 12px 30px;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 1px;
    }

    button:hover {
        opacity: 0.85;
    }

    @media (max-width: 900px) {
        .contact-section {
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .contact-left, .contact-right {
            max-width: 100%;
        }

        .contact-right {
            margin-top: 60px;
        }
    }
</style>
</head>

<body>

<section class="contact-section">
    <!-- LEFT SIDE -->
    <div class="contact-left">
        <h2>Let’s<br>make the right<br>thing.</h2>
        <p>For projects, collaborations, and thoughtful conversations.</p>

        <div class="contact-info">
            <div class="contact-item">
                <i class="fa-solid fa-envelope"></i>
                <a href="mailto:abdulaziz.andaya008@gmail.com">abdulaziz.andaya008@gmail.com</a>
            </div>
            <div class="contact-item">
                <i class="fa-brands fa-whatsapp"></i>
                <a href="https://wa.me/966558019349">+966 55 801 9349</a>
            </div>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="contact-right">
        <form action="https://formspree.io/f/mvkowqvw" method="POST">
            <label>Name</label>
            <input type="text" name="name" placeholder="Your name" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="you@company.com" required>

            <label>A little about the project</label>
            <textarea name="message" placeholder="What are you making?" rows="5" required></textarea>

            <p class="note">No decks required. Just a good starting point.</p>

            <button type="submit">SEND INQUIRY →</button>
        </form>
    </div>
</section>

</body>
</html>
